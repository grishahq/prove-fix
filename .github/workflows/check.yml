name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.11'
            pytest: 'pytest==8.3.5'
          - python: '3.13'
            pytest: 'pytest>=9,<10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '${{ matrix.pytest }}'
      - run: python -m pytest -q
      - run: python scripts/demo.py --out artifacts/ci-demo
